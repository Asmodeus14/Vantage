<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Theme-aware favicon. The tab strip is dark in dark mode and light in light
    mode, and a single black mark disappears against the first. Both glyphs are
    the same shape; only the colour differs.

    An SVG is used rather than two <link rel="icon" media="..."> elements
    because media on a favicon link is honoured inconsistently, while a media
    query *inside* an SVG icon is the established way to do this.
    app/icon.png stays as the fallback for anything that cannot render it.
  -->
  <style>
    .on-light { display: inline }
    .on-dark { display: none }
    @media (prefers-color-scheme: dark) {
      .on-light { display: none }
      .on-dark { display: inline }
    }
  </style>
  <image class="on-light" width="32" height="32" href="data:image/png;base64,"/>
  <image class="on-dark" width="32" height="32" href="data:image/png;base64,"/>
</svg>
