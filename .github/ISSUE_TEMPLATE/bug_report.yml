name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a security vulnerability?** Do not use this form — see
        [SECURITY.md](../blob/master/SECURITY.md) for private reporting.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: >
        Please include the version. Sign-in in particular behaves differently in
        Safari and in Firefox strict mode than it does in Chrome.
      placeholder: "Safari 18.2, Firefox 133 (strict), Chrome 131"
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      render: shell
